# Postgres local para desenvolvimento (em produção o banco é o Neon).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: futebol
      POSTGRES_PASSWORD: futebol
      POSTGRES_DB: futebol
    ports:
      - "5435:5432"
    volumes:
      - futebol-db:/var/lib/postgresql/data

volumes:
  futebol-db:
